services:
  m-server:
    build: .
    container_name: m-server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MEDIA_DIR=/media
      # 256-bit hex key enabling transparent decryption of "<name>.enc"
      # files. Leave unset (the default) to disable the feature entirely;
      # plain files are unaffected either way. See .env.example.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      # Host drive root (all top-level folders, not just "media"). Override
      # MEDIA_HOST_DIR in .env for local dev. create_host_path:false makes
      # Compose fail loudly if the drive isn't mounted, instead of silently
      # serving an empty auto-created directory.
      - type: bind
        source: ${MEDIA_HOST_DIR:-/srv/mediadrive}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  web:
    build: ./web
    container_name: m-server-web
    ports:
      - "8100:8100"
    environment:
      - PORT=8100
      # Directory listings are fetched server-side over the compose network,
      # so the browser never makes a cross-origin request and no CORS config
      # is needed on the API.
      - API_INTERNAL_URL=http://m-server:4000
      # Media bytes are loaded by the browser directly from the API, bypassing
      # this service so video isn't proxied through Node. Unset means "same
      # host as the UI, port 4000", which needs no configuration on the Pi.
      - MEDIA_PUBLIC_BASE=${MEDIA_PUBLIC_BASE:-}
    depends_on:
      - m-server
    restart: unless-stopped

  # One-off tool, not started by `docker compose up`. m-server's own mount
  # is read-only by design, so encrypting/decrypting files in place needs a
  # separate read-write mount of the same drive:
  #   docker compose run --rm encrypt encrypt /media/movies/clip.mp4
  #   docker compose run --rm encrypt decrypt /media/movies/clip.mp4.enc
  encrypt:
    build: .
    profiles: ["tools"]
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_DIR:-/srv/mediadrive}
        target: /media
        bind:
          create_host_path: false
    entrypoint: ["node", "scripts/media-crypto.mjs"]
